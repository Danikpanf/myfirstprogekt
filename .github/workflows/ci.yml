name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace?schema=public
      JWT_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --prefix apps/api
      - run: npm install --prefix apps/web
      - run: npm install
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma db push --schema apps/api/prisma/schema.prisma
      - run: npm run build --prefix apps/api
      - run: npm run build --prefix apps/web
